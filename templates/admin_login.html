<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8" />
  <title>Admin Login | LinkShield</title>
  <style>
    body{background:#0f131a;color:#e1e8f0;font-family:Segoe UI,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}
    .box{background:#161b22;padding:30px;border-radius:12px;width:360px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
    h1{margin:0 0 15px;color:#4f94ff;font-size:22px}
    input{width:100%;padding:12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#fff;margin:8px 0}
    button{width:100%;padding:12px;border-radius:10px;border:0;background:#2ea043;color:#fff;font-weight:bold;cursor:pointer;margin-top:10px}
    .err{color:#f85149;margin-top:10px;font-size:13px}
    a{display:block;margin-top:12px;color:#4f94ff;text-decoration:none}
    @media (max-width: 768px) {

    body {
        padding: 15px;
    }

    .container,
    .admin-container,
    .card {
        width: 95% !important;
        max-width: 95% !important;
        margin: 20px auto !important;
        padding: 15px !important;
    }

    table {
        width: 100% !important;
        display: block;
        overflow-x: auto;
        font-size: 12px;
    }

    th, td {
        padding: 8px;
        white-space: nowrap;
    }

    input,
    button,
    select {
        width: 100%;
        font-size: 16px;
    }

    h1 {
        font-size: 24px;
    }
}
  </style>
</head>
<body>
  <div class="box">
    <h1>Admin Login</h1>
    <form method="POST">
      <input name="username" placeholder="Username" required />
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    {% if error %}
      <div class="err">{{ error }}</div>
    {% endif %}

    <a href="/">← Back to Scan</a>
  </div>
</body>
</html>
